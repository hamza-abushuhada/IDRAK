<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>تفعيل الحساب — IDRAK Lab POS</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap auth-wrap"><section class="hero"><span class="eyebrow">دعوة إلى نظام الكاشير</span><h1 id="title">تفعيل حسابك</h1><p id="intro">جارٍ التحقق من الدعوة…</p></section>
<form id="activate" class="card pad auth-card" hidden novalidate><p class="pill" id="invite-for" dir="auto"></p><div class="form-field"><label for="password" id="password-label">كلمة مرور جديدة</label><input id="password" type="password" required autocomplete="new-password" minlength="10" maxlength="128" dir="ltr"></div><div class="form-field" id="confirm-field"><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" dir="ltr"></div><p class="muted" id="hint">10 أحرف على الأقل. لا تستخدم كلمة مرور حسابك في إدراك أو أي موقع آخر.</p><button class="btn wide" type="submit" id="submit">تفعيل الحساب والدخول</button><p id="error" role="alert" class="auth-error"></p></form>
<p><a href="/login">العودة لتسجيل الدخول</a></p></main><script src="/activate.js"></script></body></html>
